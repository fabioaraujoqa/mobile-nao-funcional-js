# Roda a cada push e pull request. Nada aqui precisa de celular nem da impressora:
# os testes Python usam adb, braço e relógio simulados; os de WebdriverIO rodam em --dry-run.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Testes da lógica (pytest)
        run: python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:dry-run
